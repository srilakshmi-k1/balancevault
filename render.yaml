services:
  # Backend API Web Service
  - type: web
    name: balancevault-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: balancevault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: ADMIN_EMAIL
        value: admin@balancevault.com
      - key: ADMIN_PASSWORD
        value: Admin@123456

  # Frontend Static Site
  - type: web
    name: balancevault-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: balancevault-backend
          property: host

databases:
  - name: balancevault-db
    plan: free
    region: oregon
    databaseName: balancevault
    user: balancevault
